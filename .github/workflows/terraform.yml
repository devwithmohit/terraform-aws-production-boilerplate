name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "modules/**"
      - "environments/**"
      - "bootstrap/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "modules/**"
      - "environments/**"
      - "bootstrap/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target Environment to Apply"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout the code
  pull-requests: write # Required to comment PR with plan output

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "ap-south-1"

jobs:
  lint-and-validate:
    name: "Code Quality & Validation"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - "bootstrap"
          - "environments/dev"
          - "environments/prod"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -diff -recursive

      - name: Terraform Init (Backend Validation Mode)
        working-directory: ${{ matrix.path }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.path }}
        run: terraform validate -no-color

  plan-dev:
    name: "Plan Dev"
    needs: [lint-and-validate]
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
        continue-on-error: false

      - name: Post Plan to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = `#### Dev Environment Terraform Plan: \`Success\`
            *Pushed by: @${{ github.actor }}*
            *Action: \`${{ github.event_name }}\`*

            \`\`\`hcl
            Terraform plan generated successfully for dev environment.
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  apply-dev:
    name: "Apply Dev"
    needs: [plan-dev]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

  plan-prod:
    name: "Plan Prod"
    needs: [lint-and-validate]
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: environments/prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
        continue-on-error: false

  apply-prod:
    name: "Apply Prod"
    needs: [plan-prod, apply-dev]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod # Uses GitHub Environment protection rules (requires approval)
    defaults:
      run:
        working-directory: environments/prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
